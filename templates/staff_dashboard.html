<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Pemuka Kaunter - KK Pandamaran</title>
    <script src="{{ url_for('static', path='js/htmx.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.min.css') }}">
    <style>
        /* Pembetulan sintaks daripada '-' kepada '*' */
        * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* Kunci saiz fizikal SVG jika pelayar offline daripada CDN */
        svg {
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-6 text-slate-800">

    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- Bar Header Utama -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white px-6 py-4 rounded-2xl border border-slate-200/80 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-sm shadow-md shadow-blue-500/20">
                    KKP
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-black uppercase text-blue-700">Klinik Kesihatan Pandamaran</span>
                        <span class="text-slate-300">•</span>
                        <span class="text-xs font-semibold text-slate-500">Unit Pendaftaran / Triage</span>
                    </div>
                    <h1 class="text-lg font-black text-slate-900 tracking-tight">Senarai Pra-Pendaftaran Kaunter</h1>
                </div>
            </div>

            <!-- Polling Live Pill Status -->
            <div class="flex items-center gap-2.5">
                <div class="flex items-center gap-2 bg-emerald-50 border border-emerald-200/60 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-700">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Live Polling (4s)</span>
                </div>
                <button onclick="htmx.trigger('#search-input', 'keyup')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600 transition" title="Muat Semula">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                </button>
            </div>
        </div>

        <!-- Bar Kawalan Carian & Penapis Aliran Bilik -->
        <div class="bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row gap-2.5">
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <input type="text" id="search-input" name="search"
                       placeholder="Cari Nama, No. KP (cth: 860118...), Kod Token (cth: A-T6D), atau Telefon..."
                       hx-get="/counter/queue-rows" hx-trigger="keyup changed delay:250ms, search"
                       hx-target="#patient-list" hx-include="#purpose-select"
                       class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold uppercase focus:bg-white focus:border-blue-500 outline-none transition">
            </div>

            <div class="w-full md:w-64">
                <select name="purpose_filter" id="purpose-select"
                        hx-get="/counter/queue-rows" hx-trigger="change"
                        hx-target="#patient-list" hx-include="#search-input"
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 focus:bg-white focus:border-blue-500 outline-none transition">
                    <option value="ALL">Semua Aliran Bilik</option>
                    <option value="SAKIT_BIASA">Demam / Sakit (OPD)</option>
                    <option value="TEMUJANJI">Ada Temujanji</option>
                    <option value="DRESSING">Cuci Luka / Prosedur</option>
                    <option value="LAIN_LAIN">Farmasi / Ubat</option>
                </select>
            </div>
        </div>

        <!-- Jadual Data Pesakit -->
        <div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider font-extrabold text-[11px]">
                        <tr>
                            <th class="py-3 px-4">Masa</th>
                            <th class="py-3 px-4">Kod Rujukan</th>
                            <th class="py-3 px-4">Nama Pesakit</th>
                            <th class="py-3 px-4">No. KP / Pasport</th>
                            <th class="py-3 px-4">No. Telefon</th>
                            <th class="py-3 px-4">Tujuan</th>
                            <th class="py-3 px-4">Status Alamat</th>
                            <th class="py-3 px-4 text-right">Tindakan Kaunter</th>
                        </tr>
                    </thead>
                    <tbody id="patient-list"
                           hx-get="/counter/queue-rows" hx-trigger="every 4s"
                           hx-include="#search-input, #purpose-select"
                           class="divide-y divide-slate-100 bg-white">
                        {% include "partials/patient_rows.html" %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Toast Notification Terapung -->
    <div id="toast-alert" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-xl border border-slate-800 hidden flex items-center gap-2 z-50"></div>

    <script>
        // 1. Fungsi Salin Clipboard
        function quickCopy(text, label) {
            if (!text || text === 'None') return;
            let clean = text.trim();
            if (label === 'No. KP' || label === 'No. Tel') clean = clean.replace(/[^a-zA-Z0-9]/g, '');

            const toast = document.getElementById('toast-alert');
            const showToast = () => {
                toast.innerHTML = `<span class="text-emerald-400">✓</span> <span>${label} disalin ke clipboard!</span>`;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2200);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(clean).then(showToast).catch(() => fallbackCopy(clean, showToast));
            } else {
                fallbackCopy(clean, showToast);
            }
        }

        function fallbackCopy(text, cb) {
            const el = document.createElement('textarea');
            el.value = text;
            el.style.position = 'fixed';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            cb();
        }

        // 2. Fungsi Suntikan SystmOne (Menghubungkan Local Agent Port 9999)
        async function injectToSystmOne(ic, name, phone, address) {
            const toast = document.getElementById('toast-alert');
            toast.innerHTML = `<span class="text-amber-400">⏳</span> <span>KLIK KOTAK SYSTMONE SEKARANG! (Mula dalam 2s)</span>`;
            toast.classList.remove('hidden');

            try {
                const response = await fetch('http://127.0.0.1:9999/inject', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ic: ic, name: name, phone: phone, address: address })
                });

                if (response.ok) {
                    toast.innerHTML = `<span class="text-emerald-400">✓</span> <span>Data berjaya ditaip ke SystmOne!</span>`;
                } else {
                    toast.innerHTML = `<span class="text-rose-400">⚠️</span> <span>Gagal suntik data ke SystmOne.</span>`;
                }
            } catch (err) {
                toast.innerHTML = `<span class="text-rose-400">⚠️</span> <span>Local helper (systmone_helper.py) tidak aktif di PC ini!</span>`;
            }
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        // 3. Auto-fokus Scanner Fizikal ke Kotak Carian
        document.addEventListener('keydown', function(e) {
            const input = document.getElementById('search-input');
            if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                if (e.key.length === 1 || e.key === 'Enter') input.focus();
            }
        });
    </script>
</body>
</html>
