<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Pra-Giliran KK Pandamaran</title>
    
    <!-- Script Tailwind & HTMX -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.min.css') }}">
    <script src="{{ url_for('static', path='js/htmx.min.js') }}"></script>

    <style>
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body { 
            background-color: #f1f5f9; 
            margin: 0; 
            padding: 16px 10px; 
            display: flex; 
            justify-content: center; 
        }

        /* SVG Default Size Lock (Mencegah ikon membesar jika sambungan luar talian) */
        svg {
            width: 16px !important;
            height: 16px !important;
            max-width: 16px !important;
            max-height: 16px !important;
            display: inline-block;
        }

        /* Mod Warga Emas (Senior Citizen Mode) */
        .elderly-mode {
            max-width: 620px !important;
            padding: 32px 28px !important;
            border: 3px solid #1e40af !important;
        }

        .elderly-mode h2 {
            font-size: 28px !important;
        }

        .elderly-mode p {
            font-size: 15px !important;
        }

        .elderly-mode label {
            font-size: 16px !important;
            font-weight: 800 !important;
            color: #0f172a !important;
        }

        /* Ruang khas 48px sebelah kiri bagi mengelakkan pertindihan ikon & teks */
        .elderly-mode input, 
        .elderly-mode textarea {
            font-size: 18px !important;
            padding-top: 14px !important;
            padding-bottom: 14px !important;
            padding-right: 16px !important;
            padding-left: 48px !important;
            border-width: 2.5px !important;
        }

        .elderly-mode .relative > div:first-child {
            left: 14px !important;
        }

        .elderly-mode svg {
            width: 20px !important;
            height: 20px !important;
            max-width: 20px !important;
            max-height: 20px !important;
        }

        .elderly-mode .purpose-btn {
            padding: 16px 12px !important;
            border-width: 3px !important;
        }

        .elderly-mode .purpose-btn span:nth-child(2) {
            font-size: 15px !important;
        }

        .elderly-mode .purpose-btn span:nth-child(3) {
            font-size: 12px !important;
        }

        .elderly-mode button[type="submit"] {
            font-size: 19px !important;
            padding: 18px !important;
        }
    </style>
</head>
<body>

    <div id="main-container" style="width: 100%; display: flex; justify-content: center;">
        {% include "partials/form_content.html" %}
    </div>

    <script>

        let currentDocType = 'mykad';

function setDocType(type) {
    currentDocType = type;
    const input = document.getElementById('ic_passport_input');
    const label = document.getElementById('doc-label');
    const helper = document.getElementById('doc-helper');
    const icon = document.getElementById('doc-icon');
    const docTypeHidden = document.getElementById('doc_type');
    const btnMyKad = document.getElementById('btn-type-mykad');
    const btnPassport = document.getElementById('btn-type-passport');

    input.value = ''; // Kosongkan input bila bertukar mod

    if (type === 'passport') {
        docTypeHidden.value = 'PASSPORT';
        label.innerText = 'No. Pasport / Dokumen Perjalanan';
        input.placeholder = 'Cth: A12345678 / P1234567';
        input.inputMode = 'text'; // Paparkan abjad pada telefon
        input.removeAttribute('pattern');
        input.maxLength = 20;
        helper.innerText = 'Masukkan nombor pasport penuh berserta huruf.';
        icon.innerText = '🛂';

        // Gaya Butang Pasport Aktif
        btnPassport.className = 'px-2 py-0.5 text-[10px] font-black rounded-md bg-white text-blue-700 shadow-xs transition';
        btnMyKad.className = 'px-2 py-0.5 text-[10px] font-bold rounded-md text-slate-500 hover:text-slate-800 transition';
    } else {
        docTypeHidden.value = 'MYKAD';
        label.innerText = 'No. Kad Pengenalan';
        input.placeholder = 'Cth: 860118-08-6111';
        input.inputMode = 'numeric'; // Papan kekunci angka di telefon
        input.setAttribute('pattern', '[0-9\\-]*');
        input.maxLength = 14;
        helper.innerText = 'Masukkan 12 digit nombor MyKad tanpa sengkang.';
        icon.innerText = '🪪';

        // Gaya Butang MyKad Aktif
        btnMyKad.className = 'px-2 py-0.5 text-[10px] font-black rounded-md bg-white text-blue-700 shadow-xs transition';
        btnPassport.className = 'px-2 py-0.5 text-[10px] font-bold rounded-md text-slate-500 hover:text-slate-800 transition';
    }
    input.focus();
}

function handleDocInput(input) {
    if (currentDocType === 'mykad') {
        // Format automatik sengkang untuk MyKad warganegara (cth: 900101-10-5555)
        let val = input.value.replace(/\D/g, '');
        if (val.length > 6 && val.length <= 8) {
            input.value = val.slice(0, 6) + '-' + val.slice(6);
        } else if (val.length > 8) {
            input.value = val.slice(0, 6) + '-' + val.slice(6, 8) + '-' + val.slice(8, 12);
        } else {
            input.value = val;
        }

        // Auto-detect warga emas jika lahir sebelum tahun tertentu
        if (val.length >= 2) {
            const birthYearPrefix = parseInt(val.substring(0, 2), 10);
            const currentYear = new Date().getFullYear();
            const birthYear = birthYearPrefix > (currentYear % 100) ? (1900 + birthYearPrefix) : (2000 + birthYearPrefix);
            const age = currentYear - birthYear;
            
            // Buka mod warga emas secara visual jika pesakit 60 tahun ke atas
            const container = document.getElementById('form-container');
            if (age >= 60 && container && !container.classList.contains('elderly-mode')) {
                container.classList.add('elderly-mode');
            }
        }
    } else {
        // Untuk pasport: benarkan huruf dan nombor, tukar automatik ke huruf besar (Uppercase)
        input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    }
}



        // Jalankan semakan bila halaman dibuka & selepas HTMX swap
        document.addEventListener("DOMContentLoaded", initAddressField);
        document.body.addEventListener('htmx:afterSwap', initAddressField);

        function initAddressField() {
            const radioKekal = document.querySelector('input[name="address_status"][value="KEKAL"]');
            const radioChange = document.querySelector('input[name="address_status"][value="DIKEMASKINI"]');
            
            if (radioKekal && radioKekal.checked) {
                toggleAddressInput('KEKAL');
            } else if (radioChange && radioChange.checked) {
                toggleAddressInput('DIKEMASKINI');
            }
        }

        function toggleAddressInput(status) {
            const newAddressBox = document.getElementById('new-address-container');
            const sameNote = document.getElementById('same-address-note');
            const fullAddressInput = document.getElementById('full_address_input');
            const cardSame = document.getElementById('card-same');
            const cardChange = document.getElementById('card-change');

            if (status === 'DIKEMASKINI') {
                if (newAddressBox) newAddressBox.style.display = 'block';
                if (sameNote) sameNote.style.display = 'none';
                
                if (fullAddressInput) {
                    fullAddressInput.required = true;
                    if (fullAddressInput.value === "KEKAL SEPERTI REKOD SEDIA ADA") {
                        fullAddressInput.value = "";
                    }
                }
                
                if (cardChange) {
                    cardChange.className = "flex flex-col p-3 rounded-2xl border-2 border-blue-600 bg-blue-50/60 cursor-pointer transition";
                }
                if (cardSame) {
                    cardSame.className = "flex flex-col p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-slate-300 cursor-pointer transition";
                }
            } else {
                if (newAddressBox) newAddressBox.style.display = 'none';
                if (sameNote) sameNote.style.display = 'flex';
                
                if (fullAddressInput) {
                    fullAddressInput.required = false;
                    fullAddressInput.value = "KEKAL SEPERTI REKOD SEDIA ADA";
                }
                
                if (cardSame) {
                    cardSame.className = "flex flex-col p-3 rounded-2xl border-2 border-blue-600 bg-blue-50/60 cursor-pointer transition";
                }
                if (cardChange) {
                    cardChange.className = "flex flex-col p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-slate-300 cursor-pointer transition";
                }
            }
        }

        function setPurpose(value, index) {
            const hiddenInput = document.getElementById('selected_visit_purpose');
            if (hiddenInput) {
                hiddenInput.value = value;
            }

            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`btn-purpose-${i}`);
                if (btn) {
                    if (i === index) {
                        btn.className = "purpose-btn active p-3 rounded-2xl border-2 border-blue-600 bg-blue-50/60 text-left transition-all relative overflow-hidden group";
                    } else {
                        btn.className = "purpose-btn p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-slate-300 text-left transition-all relative overflow-hidden group";
                    }
                }
            }
        }

        function formatIC(input) {
            let val = input.value.toUpperCase().replace(/\D/g, '');
            if (val.length > 6 && val.length <= 8) {
                input.value = val.slice(0, 6) + '-' + val.slice(6);
            } else if (val.length > 8) {
                input.value = val.slice(0, 6) + '-' + val.slice(6, 8) + '-' + val.slice(8, 12);
            } else {
                input.value = input.value.toUpperCase();
            }
        }

        async function lookupPostcode(postcode) {
            const feedback = document.getElementById('postcode_feedback');
            const cityDisplay = document.getElementById('city_display');
            const stateDisplay = document.getElementById('state_display');

            if (!feedback || !cityDisplay || !stateDisplay) return;

            const cleanCode = postcode.replace(/\D/g, '');
            if (cleanCode.length === 5) {
                feedback.style.color = "#475569";
                feedback.innerText = "Menyemak zon kawasan...";

                try {
                    const res = await fetch(`/api/lookup-postcode/${cleanCode}`);
                    if (!res.ok) throw new Error("Gagal hubungi endpoint poskod");
                    const data = await res.json();
                    
                    if (data.found && data.in_zone) {
                        cityDisplay.value = data.city;
                        stateDisplay.value = data.state;
                        feedback.style.color = "#15803d";
                        feedback.innerText = `✓ Dalam Zon KK Pandamaran: ${data.area}`;
                    } else if (data.found && !data.in_zone) {
                        cityDisplay.value = data.city;
                        stateDisplay.value = data.state;
                        feedback.style.color = "#d97706";
                        feedback.innerText = `⚠️ Kawasan: ${data.area}. Disyorkan: ${data.nearest_kk}`;
                    } else {
                        feedback.style.color = "#b91c1c";
                        feedback.innerText = "⚠️ Poskod di luar kawasan operasi KK Pandamaran.";
                    }
                } catch (e) {
                    console.error("Ralat semakan poskod:", e);
                    feedback.style.color = "#b91c1c";
                    feedback.innerText = "Ralat semasa menyemak poskod.";
                }
            } else {
                feedback.innerText = "";
            }
        }
    </script>
</body>
</html>
