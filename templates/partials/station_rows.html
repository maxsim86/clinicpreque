<!-- templates/partials/station_rows.html -->
{% for p in patients %}
<tr id="station-row-{{ p.id }}" 
    class="hover:bg-blue-50/70 transition-colors group border-b border-slate-100 last:border-0">
    
    <!-- 1. Masa Pendaftaran -->
    <td class="p-3 font-bold text-slate-400 whitespace-nowrap text-xs">
        {{ p.created_at.strftime("%H:%M") if p.created_at else "-" }}
    </td>

    <!-- 2. Pas Daftar & Butang Edit Cepat -->
    <td class="p-3 whitespace-nowrap">
        <div id="token-container-{{ p.id }}" class="flex items-center gap-1.5">
            <span class="inline-flex px-2 py-0.5 rounded-md text-[11px] font-black 
                         {% if p.token_code.startswith('D') %}bg-rose-50 text-rose-700 border border-rose-200
                         {% elif p.token_code.startswith('A') %}bg-blue-50 text-blue-700 border border-blue-200
                         {% elif p.token_code.startswith('P') %}bg-amber-50 text-amber-700 border border-amber-200
                         {% else %}bg-purple-50 text-purple-700 border border-purple-200{% endif %}">
                {{ p.token_code }}
            </span>
            <button type="button" 
                    hx-get="/counter/edit-token/{{ p.id }}" 
                    hx-target="#token-container-{{ p.id }}" 
                    hx-swap="outerHTML"
                    class="p-0.5 text-slate-300 group-hover:text-slate-600 hover:text-blue-600 text-xs rounded transition shrink-0" 
                    title="Edit nombor ikut SystmOne">
                ✏️
            </button>
        </div>
    </td>

    <!-- 3. Nama Pesakit & No. KP -->
    <td class="p-3">
        <div class="flex items-center gap-1.5">
            <span class="font-extrabold text-slate-900 text-xs block truncate max-w-[190px]" title="{{ p.full_name }}">
                {{ p.full_name }}
            </span>
            {% if p.address_status == 'DIKEMASKINI' %}
                <span class="inline-block w-2 h-2 rounded-full bg-amber-500 shrink-0" title="Ada pertukaran alamat"></span>
            {% endif %}
        </div>
        <span class="text-[10px] text-slate-400 font-semibold block">{{ p.ic_passport }}</span>
    </td>

    <!-- 4. Butang Tindakan (PILIH + BATAL) -->
    <td class="p-3 text-right whitespace-nowrap">
        <div class="inline-flex items-center gap-1.5 justify-end">
            <!-- Butang Pilih Pesakit ke Panel Kiri -->
            <button type="button"
                    hx-get="/counter/station/patient-card/{{ p.id }}"
                    hx-target="#active-patient-zone"
                    hx-swap="innerHTML"
                    onclick="highlightRow('station-row-{{ p.id }}')"
                    class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-black text-[11px] rounded-lg shadow-sm shadow-blue-500/20 transition inline-flex items-center gap-1">
                <span>Pilih</span>
                <span>➔</span>
            </button>

            <!-- Butang Batal / Gugur Baris Ini -->
            <button type="button" 
                    hx-post="/counter/cancel-patient/{{ p.id }}" 
                    hx-confirm="Adakah anda pasti mahu membatalkan pesakit ini ({{ p.full_name }}) daripada senarai menunggu?"
                    class="p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" 
                    title="Batal / Gugur dari Senarai">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="4" class="p-8 text-center text-slate-400 font-bold text-xs">
        Tiada pesakit dalam senarai menunggu saringan.
    </td>
</tr>
{% endfor %}
