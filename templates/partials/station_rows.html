<!-- templates/partials/station_rows.html -->
{% for p in patients %}
<tr id="station-row-{{ p.id }}" class="hover:bg-blue-50/60 transition-colors border-b border-slate-100 last:border-0">
    <!-- 1. Masa Tiba -->
    <td class="p-3 font-bold text-slate-500 whitespace-nowrap text-xs w-16">
        {{ p.created_at.strftime("%H:%M") if p.created_at else "-" }}
    </td>

    <!-- 2. Token Bersiri & Edit Cepat (Lebar Terkawal untuk Mencegah Pertindihan) -->
    <td class="p-3 whitespace-nowrap min-w-[130px]">
        <div id="token-container-{{ p.id }}" class="flex items-center gap-1.5">
            <span class="inline-flex px-2 py-0.5 rounded-md text-[11px] font-black bg-blue-50 text-blue-700 border border-blue-200 tracking-wider">
                {{ p.token_code }}
            </span>
            <!-- Ikon Pensel (Kelihatan samar secara lalai, jelas bila disentuh/hover) -->
            <button type="button" 
                    hx-get="/counter/edit-token/{{ p.id }}" 
                    hx-target="#token-container-{{ p.id }}" 
                    hx-swap="outerHTML"
                    class="p-0.5 text-slate-400 hover:text-blue-600 text-xs rounded hover:bg-slate-100 transition inline-flex items-center justify-center shrink-0" 
                    title="Edit nombor ikut SystmOne">
                ✏️
            </button>
        </div>
    </td>

    <!-- 3. Nama Pesakit (Truncate Selamat dengan Tooltip Penuh) -->
    <td class="p-3 font-extrabold text-slate-900 text-xs">
        <span class="block truncate max-w-[120px] sm:max-w-[160px]" title="{{ p.full_name }}">
            {{ p.full_name }}
        </span>
    </td>

    <!-- 4. Butang Tindakan Pilih -->
    <td class="p-3 text-right whitespace-nowrap w-20">
        <button type="button"
                hx-get="/counter/station/patient-card/{{ p.id }}"
                hx-target="#active-patient-zone"
                hx-swap="innerHTML"
                class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-black text-[11px] rounded-lg shadow-sm transition inline-flex items-center gap-1">
            <span>Pilih</span>
            <span>➔</span>
        </button>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="4" class="p-8 text-center text-slate-400 font-medium text-xs">
        Tiada pesakit dalam senarai menunggu saringan.
    </td>
</tr>
{% endfor %}
