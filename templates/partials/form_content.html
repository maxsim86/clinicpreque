<!-- templates/partials/form_content.html -->
<div id="form-container" class="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-8 transition-all {% if elderly %}elderly-mode{% endif %}">
    
    <!-- Top Action Bar -->
    <div class="flex justify-between items-center pb-4 mb-6 border-b border-slate-100">
        <!-- Butang Mod Warga Emas (Menyasarkan #main-container secara selamat) -->
        <button type="button" 
                hx-get="/get-form-content?lang={{ lang }}&elderly={% if elderly %}false{% else %}true{% endif %}"
                hx-target="#main-container"
                hx-swap="innerHTML"
                class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold transition-all border
                       {% if elderly %}bg-amber-500 text-white border-amber-600 shadow-md ring-2 ring-amber-300{% else %}bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100{% endif %}">
            <span>👓 {{ t.elderly_mode }}</span>
        </button>

        <!-- Butang Bahasa (Menyasarkan #main-container secara selamat) -->
        <div class="flex items-center bg-slate-100 p-1 rounded-xl">
            <button type="button" 
                    hx-get="/get-form-content?lang=bm&elderly={% if elderly %}true{% else %}false{% endif %}"
                    hx-target="#main-container"
                    hx-swap="innerHTML"
                    class="px-3 py-1 rounded-lg text-xs font-black transition-all {% if lang == 'bm' %}bg-white text-blue-700 shadow-sm{% else %}text-slate-500 hover:text-slate-900{% endif %}">
                BM
            </button>
            <button type="button" 
                    hx-get="/get-form-content?lang=en&elderly={% if elderly %}true{% else %}false{% endif %}"
                    hx-target="#main-container"
                    hx-swap="innerHTML"
                    class="px-3 py-1 rounded-lg text-xs font-black transition-all {% if lang == 'en' %}bg-white text-blue-700 shadow-sm{% else %}text-slate-500 hover:text-slate-900{% endif %}">
                EN
            </button>
        </div>
    </div>

    <!-- Header Tajuk Klinik -->
    <div class="text-center mb-6">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wider bg-blue-50 text-blue-700 border border-blue-100 mb-2">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span> KK PANDAMARAN
        </span>
        <h2 class="text-2xl font-black text-slate-800 tracking-tight">{{ t.title }}</h2>
        <p class="text-xs text-slate-500 font-medium mt-1">{{ t.subtitle }}</p>
    </div>

    <!-- Borang Pendaftaran -->
    <form hx-post="/submit-patient" 
          hx-target="#main-container" 
          hx-swap="innerHTML"
          class="space-y-4">
        
        <!-- 1. No. KP Input -->
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">{{ t.ic_label }}</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg width="16" height="16" style="width:16px; height:16px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/>
                    </svg>
                </div>
                <input type="text" name="ic_passport" required placeholder="Cth: 860118-08-6111" maxlength="14"
                       hx-get="/check-ic" hx-trigger="keyup changed delay:500ms" hx-target="#returning-patient-zone"
                       class="w-full pl-10 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl text-sm font-semibold tracking-wider uppercase focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition"
                       oninput="formatIC(this)">
            </div>
            <!-- Bekas sasaran returning-patient-zone -->
            <div id="returning-patient-zone"></div>
        </div>

        <!-- 2. Nama Penuh Input -->
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">{{ t.name_label }}</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg width="16" height="16" style="width:16px; height:16px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <input type="text" name="full_name" required placeholder="NAMA SEPERTI DALAM KAD PENGENALAN"
                       class="w-full pl-10 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl text-sm font-semibold uppercase focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition"
                       oninput="this.value = this.value.toUpperCase()">
            </div>
        </div>

        <!-- 3. Nombor Telefon Input -->
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">{{ t.phone_label }}</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg width="16" height="16" style="width:16px; height:16px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                </div>
                <input type="tel" name="phone_number" required placeholder="Cth: 016-6148041"
                       class="w-full pl-10 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl text-sm font-semibold focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition">
            </div>
        </div>

        <!-- 4. Kategori Tujuan Kehadiran (2x2 Grid) -->
        <div class="pt-2">
            <label class="block text-xs font-bold text-slate-700 mb-2 uppercase tracking-wide">{{ t.purpose_title }}</label>
            <input type="hidden" name="visit_purpose" id="selected_visit_purpose" value="SAKIT_BIASA">

            <div class="grid grid-cols-2 gap-2.5">
                <button type="button" id="btn-purpose-1" onclick="setPurpose('SAKIT_BIASA', 1)"
                        class="purpose-btn active p-3 rounded-2xl border-2 border-blue-600 bg-blue-50/60 text-left transition-all relative overflow-hidden group">
                    <span class="text-xl block mb-1">🤒</span>
                    <span class="block text-xs font-black text-slate-800 leading-tight">{{ t.p1_title }}</span>
                    <span class="block text-[10px] text-slate-500 mt-1 leading-snug">{{ t.p1_desc }}</span>
                </button>

                <button type="button" id="btn-purpose-2" onclick="setPurpose('TEMUJANJI', 2)"
                        class="purpose-btn p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-slate-300 text-left transition-all relative overflow-hidden group">
                    <span class="text-xl block mb-1">📅</span>
                    <span class="block text-xs font-black text-slate-800 leading-tight">{{ t.p2_title }}</span>
                    <span class="block text-[10px] text-slate-500 mt-1 leading-snug">{{ t.p2_desc }}</span>
                </button>

                <button type="button" id="btn-purpose-3" onclick="setPurpose('DRESSING', 3)"
                        class="purpose-btn p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-slate-300 text-left transition-all relative overflow-hidden group">
                    <span class="text-xl block mb-1">🩹</span>
                    <span class="block text-xs font-black text-slate-800 leading-tight">{{ t.p3_title }}</span>
                    <span class="block text-[10px] text-slate-500 mt-1 leading-snug">{{ t.p3_desc }}</span>
                </button>

                <button type="button" id="btn-purpose-4" onclick="setPurpose('LAIN_LAIN', 4)"
                        class="purpose-btn p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-slate-300 text-left transition-all relative overflow-hidden group">
                    <span class="text-xl block mb-1">💊</span>
                    <span class="block text-xs font-black text-slate-800 leading-tight">{{ t.p4_title }}</span>
                    <span class="block text-[10px] text-slate-500 mt-1 leading-snug">{{ t.p4_desc }}</span>
                </button>
            </div>
        </div>

        <!-- 5. Status Alamat & Tempat Tinggal -->
        <div class="pt-2">
            <label class="block text-xs font-bold text-slate-700 mb-2 uppercase tracking-wide">{{ t.addr_title }}</label>
            
            <div class="grid grid-cols-2 gap-2.5 mb-2.5">
                <label id="card-same" class="flex flex-col p-3 rounded-2xl border-2 border-blue-600 bg-blue-50/60 cursor-pointer transition">
                    <div class="flex items-center gap-2 mb-1">
                        <input type="radio" name="address_status" value="KEKAL" checked onchange="toggleAddressInput('KEKAL')" class="text-blue-600 focus:ring-0">
                        <span class="text-xs font-black text-slate-800">{{ t.addr_same }}</span>
                    </div>
                    <span class="text-[10px] text-slate-500 leading-tight pl-5">{{ t.addr_same_desc }}</span>
                </label>

                <label id="card-change" class="flex flex-col p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-slate-300 cursor-pointer transition">
                    <div class="flex items-center gap-2 mb-1">
                        <input type="radio" name="address_status" value="DIKEMASKINI" onchange="toggleAddressInput('DIKEMASKINI')" class="text-blue-600 focus:ring-0">
                        <span class="text-xs font-black text-slate-800">{{ t.addr_change }}</span>
                    </div>
                    <span class="text-[10px] text-slate-500 leading-tight pl-5">{{ t.addr_change_desc }}</span>
                </label>
            </div>

            <!-- Notis Hijau -->
            <div id="same-address-note" style="display: flex;" class="p-3 bg-emerald-50 border border-emerald-200/80 rounded-xl text-emerald-800 text-xs font-semibold items-center gap-2">
                <svg width="18" height="18" style="width:18px; height:18px;" class="text-emerald-600 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <span>Alamat sedia ada dalam IC akan terus digunapakai.</span>
            </div>

            <!-- Borang Masuk Alamat Baharu -->
            <div id="new-address-container" style="display: none;" class="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-3 mt-2">
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Poskod Kawasan (5 Digit)</label>
                    <input type="text" id="postcode_input" maxlength="5" placeholder="Cth: 42000"
                           class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-blue-500"
                           oninput="lookupPostcode(this.value)">
                    <div id="postcode_feedback" class="text-[10px] font-bold mt-1"></div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Bandar</label>
                        <input type="text" id="city_display" value="KLANG" readonly class="w-full px-2.5 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-semibold text-slate-600">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Negeri</label>
                        <input type="text" id="state_display" value="SELANGOR" readonly class="w-full px-2.5 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-semibold text-slate-600">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">No. Rumah / Jalan / Taman</label>
                    <textarea id="full_address_input" name="address" rows="2" placeholder="NO. RUMAH, JALAN..."
                              class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold uppercase outline-none focus:border-blue-500"
                              oninput="this.value = this.value.toUpperCase()">KEKAL SEPERTI REKOD SEDIA ADA</textarea>
                </div>
            </div>
        </div>

        <!-- 6. Butang Hantar Borang -->
        <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white text-base font-extrabold rounded-2xl shadow-lg shadow-blue-600/25 transition-all mt-4">
            {{ t.submit_btn }}
        </button>
    </form>
</div>
