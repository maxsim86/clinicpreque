<div class="bg-white border-2 border-blue-500 rounded-3xl p-5 shadow-sm space-y-3">
    <!-- Input Tersembunyi: Membawa ID pesakit ke dalam borang triage-form -->
    <input type="hidden" name="patient_id" value="{{ p.id }}" form="triage-form">

    <div class="flex justify-between items-start border-b border-slate-100 pb-3">
        <div>
            <span class="text-xs font-black text-blue-700 bg-blue-50 border border-blue-200/80 px-2.5 py-1 rounded-lg tracking-wider">Token: {{ p.token_code }}</span>
            <h2 class="text-lg font-black text-slate-900 mt-2 tracking-tight">{{ p.full_name }}</h2>
        </div>
        <span class="text-xs text-slate-400 font-bold">Tiba: {{ p.created_at.strftime("%H:%M") if p.created_at else "-" }}</span>
    </div>

    <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/70 flex justify-between items-center">
            <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase block">No. KP</span>
                <span class="font-extrabold text-slate-800">{{ p.ic_passport }}</span>
            </div>
            <button type="button" onclick="quickCopy('{{ p.ic_passport }}', 'No. KP')" class="p-1 rounded bg-white border border-slate-200 font-bold text-slate-600">📋</button>
        </div>

        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/70 flex justify-between items-center">
            <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase block">Telefon</span>
                <span class="font-extrabold text-slate-800">{{ p.phone_number }}</span>
            </div>
            <button type="button" onclick="quickCopy('{{ p.phone_number }}', 'Telefon')" class="p-1 rounded bg-white border border-slate-200 font-bold text-slate-600">📋</button>
        </div>
    </div>

    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/70 text-xs">
        <div class="flex justify-between items-center mb-1">
            <span class="text-[10px] font-black text-slate-400 uppercase">Status Alamat</span>
            {% if p.address_status == 'DIKEMASKINI' %}
                <span class="bg-amber-100 text-amber-900 text-[10px] font-black px-1.5 py-0.5 rounded">⚠️ ALAMAT BAHARU</span>
            {% else %}
                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-1.5 py-0.5 rounded">✓ REKOD KEKAL</span>
            {% endif %}
        </div>
        <p class="font-semibold text-slate-700 truncate text-[11px]">{{ p.address }}</p>
    </div>
</div>
