<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaunter - Semakan Pra-Pendaftaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX Script -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Senarai Pra-Pendaftaran Kaunter</h1>
            <div class="flex items-center space-x-2">
                <span class="inline-block w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-sm text-gray-500">Live Polling HTMX (3s)</span>
            </div>
        </div>

        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Masa</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Kod Token</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Nama Penuh</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">No. KP / Passport</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">No. Tel</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Alamat</th>
                        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Tindakan</th>
                    </tr>
                </thead>
                <!-- HTMX: Auto polling setiap 3 saat tanpa kelipan skrin -->
                <tbody id="patient-list" 
                       hx-get="/counter/queue-rows" 
                       hx-trigger="every 3s" 
                       hx-swap="innerHTML" 
                       class="divide-y divide-gray-200">
                    {% include "partials/patient_rows.html" %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
