{% for p in patients %}
<tr id="patient-row-{{ p.id }}" class="hover:bg-gray-50">
    <td class="px-6 py-4 text-sm text-gray-500">{{ p.created_at.strftime("%H:%M") }}</td>
    <td class="px-6 py-4 text-sm font-bold text-blue-600">{{ p.token_code }}</td>
    <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ p.full_name }}</td>
    <td class="px-6 py-4 text-sm text-gray-700">{{ p.ic_passport }}</td>
    <td class="px-6 py-4 text-sm text-gray-700">{{ p.phone_number }}</td>
    <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate">{{ p.address }}</td>
    <td class="px-6 py-4 text-sm text-right">
        <!-- HTMX: Padam baris serta merta dari DOM bila staf tekan selesai -->
        <button hx-post="/serve-patient/{{ p.id }}"
                hx-target="#patient-row-{{ p.id }}"
                hx-swap="outerHTML"
                class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded transition">
            Selesai Daftar
        </button>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="7" class="text-center py-8 text-gray-400">Tiada pesakit dalam senarai menunggu.</td>
</tr>
{% endfor %}
