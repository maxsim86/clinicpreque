<!-- Kad Borang Utama (Target pertukaran HTMX) -->
<div id="form-container" class="card {% if elderly %}elderly-mode{% endif %}">
    
    <!-- Toolbar Pilihan Bahasa & Mod Warga Emas -->
    <div class="toolbar">
        <button type="button" 
                hx-get="/get-form-content?lang={{ lang }}&elderly={% if elderly %}false{% else %}true{% endif %}"
                hx-target="#form-container"
                hx-swap="outerHTML"
                class="btn-elderly"
                style="background: {% if elderly %}#fef3c7{% else %}#f1f5f9{% endif %}; color: {% if elderly %}#92400e{% else %}#475569{% endif %};">
            👓 {{ t.elderly_mode }}
        </button>

        <div style="display: flex; gap: 4px;">
            <button type="button" 
                    hx-get="/get-form-content?lang=bm&elderly={{ 'true' if elderly else 'false' }}"
                    hx-target="#form-container"
                    hx-swap="outerHTML"
                    class="btn-lang {% if lang == 'bm' %}active-lang{% endif %}">BM</button>
            <button type="button" 
                    hx-get="/get-form-content?lang=en&elderly={{ 'true' if elderly else 'false' }}"
                    hx-target="#form-container"
                    hx-swap="outerHTML"
                    class="btn-lang {% if lang == 'en' %}active-lang{% endif %}">EN</button>
        </div>
    </div>

    <div class="header">
        <span class="badge-kk">Klinik Kesihatan Pandamaran</span>
        <h2>{{ t.title }}</h2>
        <p>{{ t.subtitle }}</p>
    </div>

    <!-- HTMX POST: Hantar borang dan ganti form-container dengan kad QR token -->
    <form hx-post="/submit-patient" 
          hx-target="#form-container" 
          hx-swap="outerHTML">

        <!-- 1. No. Kad Pengenalan (Semakan Rekod Lama via HTMX) -->
        <div class="form-group">
            <label>{{ t.ic_label }}</label>
            <input type="text" name="ic_passport" id="ic_input" required 
                   placeholder="Cth: 900101-10-5555" maxlength="14"
                   hx-get="/check-ic"
                   hx-trigger="keyup changed delay:600ms"
                   hx-target="#returning-patient-zone"
                   hx-swap="innerHTML"
                   class="input-control" oninput="formatIC(this)">
        </div>

        <!-- Zon Pesakit Ulangan (Diisi oleh HTMX jika ada rekod) -->
        <div id="returning-patient-zone"></div>

        <!-- 2. Nama Penuh -->
        <div class="form-group">
            <label>{{ t.name_label }}</label>
            <input type="text" name="full_name" required 
                   autocomplete="name" placeholder="SEPERTI DALAM KAD PENGENALAN"
                   class="input-control" oninput="this.value = this.value.toUpperCase()">
        </div>

        <!-- 3. Nombor Telefon -->
        <div class="form-group">
            <label>{{ t.phone_label }}</label>
            <input type="tel" name="phone_number" required 
                   autocomplete="tel" placeholder="012-3456789" 
                   class="input-control">
        </div>

<!-- Bahagian Tujuan Kehadiran (Gaya Kad Butang Sentuh Penuh) -->
<div class="form-group" style="margin-top: 18px;">
    <label style="font-size: 14px; font-weight: 800; color: #1e293b; margin-bottom: 8px; display: block;">
        {{ t.purpose_title }}
    </label>

    <!-- Hidden input yang menyimpan nilai pilihan untuk dihantar ke backend -->
    <input type="hidden" name="visit_purpose" id="selected_visit_purpose" value="SAKIT_BIASA">

    <!-- Grid 2x2 Butang Fleksibel -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        
        <!-- Butang 1: Sakit Biasa -->
        <button type="button" 
                id="btn-purpose-1" 
                class="purpose-btn active" 
                onclick="setPurpose('SAKIT_BIASA', 1)">
            <span class="btn-icon">🤒</span>
            <span class="btn-title">{{ t.p1_title }}</span>
            <span class="btn-subtitle">{{ t.p1_desc }}</span>
        </button>

        <!-- Butang 2: Temujanji -->
        <button type="button" 
                id="btn-purpose-2" 
                class="purpose-btn" 
                onclick="setPurpose('TEMUJANJI', 2)">
            <span class="btn-icon">📅</span>
            <span class="btn-title">{{ t.p2_title }}</span>
            <span class="btn-subtitle">{{ t.p2_desc }}</span>
        </button>

        <!-- Butang 3: Cuci Luka / Prosedur -->
        <button type="button" 
                id="btn-purpose-3" 
                class="purpose-btn" 
                onclick="setPurpose('DRESSING', 3)">
            <span class="btn-icon">🩹</span>
            <span class="btn-title">{{ t.p3_title }}</span>
            <span class="btn-subtitle">{{ t.p3_desc }}</span>
        </button>

        <!-- Butang 4: Lain-lain / Ubat -->
        <button type="button" 
                id="btn-purpose-4" 
                class="purpose-btn" 
                onclick="setPurpose('LAIN_LAIN', 4)">
            <span class="btn-icon">💊</span>
            <span class="btn-title">{{ t.p4_title }}</span>
            <span class="btn-subtitle">{{ t.p4_desc }}</span>
        </button>

    </div>
</div>

        <!-- 5. Pilihan Status Alamat & Tempat Tinggal -->
        <div class="status-box">
            <span class="status-title">{{ t.addr_title }}</span>
            
            <div class="radio-grid">
                <label id="card-same" class="radio-card active">
                    <input type="radio" name="address_status" value="KEKAL" checked onchange="toggleAddressInput(this.value)">
                    <span class="title">{{ t.addr_same }}</span>
                    <div class="desc">{{ t.addr_same_desc }}</div>
                </label>

                <label id="card-change" class="radio-card">
                    <input type="radio" name="address_status" value="DIKEMASKINI" onchange="toggleAddressInput(this.value)">
                    <span class="title">{{ t.addr_change }}</span>
                    <div class="desc">{{ t.addr_change_desc }}</div>
                </label>
            </div>

            <!-- Notis Hijau jika Tiada Perubahan -->
            <div id="same-address-note" class="note-green" style="display: block;">
                ✓ Alamat sedia ada dalam ic akan terus digunapakai.
            </div>

            <!-- Ruangan Alamat Baru (Disorokkan secara default) -->
            <div id="new-address-container" style="display: none; margin-top: 12px;">
                <div class="info-pandamaran">
                    📍 <strong>Zon Utama KK Pandamaran:</strong> Pandamaran (42000 / 42450), Bukit Tinggi/Botanic (41200), Teluk Pulai (41100).
                </div>

                <div class="form-group">
                    <label>Poskod (5 Digit)</label>
                    <input type="text" id="postcode_input" maxlength="5" placeholder="Cth: 42000"
                           class="input-control" oninput="lookupPostcode(this.value)">
                    <div id="postcode_feedback" style="font-size: 11px; margin-top: 5px; font-weight: 700;"></div>
                </div>

                <div class="grid-2">
                    <div>
                        <label style="font-size: 11px; font-weight: 700; color: #475569;">Bandar / Kawasan</label>
                        <input type="text" id="city_display" value="KLANG" readonly class="input-control input-readonly">
                    </div>
                    <div>
                        <label style="font-size: 11px; font-weight: 700; color: #475569;">Negeri</label>
                        <input type="text" id="state_display" value="SELANGOR" readonly class="input-control input-readonly">
                    </div>
                </div>

                <div class="form-group">
                    <label>Alamat Rumah / Jalan (Kawasan Pandamaran / Klang)</label>
                    <textarea id="full_address_input" name="address" rows="2"
                              placeholder="NO. RUMAH, JALAN, TAMAN"
                              class="input-control" oninput="this.value = this.value.toUpperCase()"></textarea>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit">{{ t.submit_btn }}</button>
    </form>
</div>
